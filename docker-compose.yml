services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 5: trace/span storage + UI for OpenTelemetry/OpenInference traces
  # emitted by the api service (rag/telemetry.py). UI + OTLP-over-HTTP share
  # port 6006; OTLP-over-gRPC is 4317 (unused here - the api exports HTTP).
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    volumes:
      - phoenix_data:/mnt/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6006' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 5: persists /feedback submissions, correlated to trace_id (see
  # app/db/models.py). Schema is created automatically by the api service's
  # startup lifespan (app/main.py) - no separate migration step needed.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag_observability}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_QDRANT_COLLECTION_NAME: ${RAG_QDRANT_COLLECTION_NAME:-postgres_docs}
      RAG_EMBEDDING_MODEL_NAME: ${RAG_EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      RAG_EMBEDDING_CACHE_DIR: /app/.cache/embeddings
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_CHUNK_SIZE_TOKENS: ${RAG_CHUNK_SIZE_TOKENS:-512}
      RAG_CHUNK_OVERLAP_RATIO: ${RAG_CHUNK_OVERLAP_RATIO:-0.15}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-gpt-4o-mini}
      RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-dense}
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      RAG_QUERY_REWRITE_ENABLED: ${RAG_QUERY_REWRITE_ENABLED:-false}
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
      # Phase 5: observability - on by default in docker-compose (Phoenix and
      # Postgres are always available here); off by default in config.py for
      # bare `uv run uvicorn ...`/tests, where they usually aren't running.
      RAG_OTEL_ENABLED: ${RAG_OTEL_ENABLED:-true}
      RAG_OTEL_SERVICE_NAME: ${RAG_OTEL_SERVICE_NAME:-anti-hallucination-rag}
      RAG_PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      RAG_POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag_observability}
      RAG_METRICS_WINDOW_SIZE: ${RAG_METRICS_WINDOW_SIZE:-100}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The default embedding model is baked into the image at build time
      # (see Dockerfile), so the container never needs outbound network
      # access just to serve a query. Unset this (HF_HUB_OFFLINE=) if you
      # override RAG_EMBEDDING_MODEL_NAME with a model that isn't baked in,
      # or set RAG_RERANKER_ENABLED=true - the reranker model isn't baked
      # into the image and is downloaded on first use.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
    volumes:
      - model_cache:/app/.cache/embeddings
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      phoenix:
        condition: service_healthy

  # Phase 5 (stretch, optional): dashboards over the same `postgres` service -
  # no Prometheus/exporter needed. Not required for the "docker compose up"
  # success criteria (api/qdrant/phoenix/postgres only) and never blocks it;
  # Phoenix remains the primary observability tool. See the README's
  # "Grafana (optional)" section.
  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  qdrant_data:
  model_cache:
  phoenix_data:
  postgres_data:
  grafana_data:
